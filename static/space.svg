    <radialGradient id="pl" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffb86c"/><stop offset=".55" stop-color="#e0527a"/><stop offset="1" stop-color="#3b0a45"/></radialGradient>
