<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated space banner">
  <style>
    .s { fill:#fff; animation: tw ease-in-out infinite alternate; }
    @keyframes tw { from { opacity:.15 } to { opacity:1 } }
    .ufo { animation: fly 14s linear infinite; }
    @keyframes fly { 0% { transform: translate(-160px,90px) } 45% { transform: translate(600px,70px) } 55% { transform: translate(600px,70px) } 100% { transform: translate(1360px,110px) } }
    .bob { animation: bob 1.6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(-4px) } to { transform: translateY(4px) } }
    .beam { opacity:0; animation: beam 14s linear infinite; }
    @keyframes beam { 0%,44% { opacity:0 } 47%,53% { opacity:.55 } 56%,100% { opacity:0 } }
    .l1, .l2, .l3 { fill:#ffeb3b; animation: blink .9s steps(2) infinite; }
    .l2 { animation-delay:.3s }
    .l3 { animation-delay:.6s }
    @keyframes blink { 0% { fill:#ffeb3b } 100% { fill:#ff4081 } }
    .planet { animation: drift 20s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(-18px,8px) } }
    .moon { animation: orbit 12s linear infinite; transform-origin: 1010px 150px; }
    @keyframes orbit { to { transform: rotate(360deg) } }
    .shoot { animation: shoot 7s ease-in infinite; opacity:0; }
    @keyframes shoot { 0%,80% { transform: translate(0,0); opacity:0 } 82% { opacity:1 } 95%,100% { transform: translate(-420px,220px); opacity:0 } }
    .title { font: 700 44px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill:#fff; }
    .sub { font: 400 20px 'Fira Code', Consolas, monospace; fill:#b39ddb; }
    .cursor { animation: cur 1s steps(2) infinite; }
    @keyframes cur { 0% { opacity:1 } 100% { opacity:0 } }
  </style>
